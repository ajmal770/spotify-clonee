<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify</title>
  <link
      rel="icon"
      href="https://static.vecteezy.com/system/resources/previews/023/986/728/non_2x/spotify-logo-spotify-logo-transparent-spotify-icon-transparent-free-free-png.png"
      type="image/png"
    />
  {% load static %}
  <link rel="stylesheet" href="{% static 'sing2.css' %}" />
  <script src="{% static 'javaScriptsfile/sing2.js' %}" defer></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
</head>

<body>
  <div class="container">

    <!-- Logo -->
    <img
      class="s2-logo"
      src="https://storage.googleapis.com/pr-newsroom-wp/1/2023/05/Spotify_Primary_Logo_RGB_White.png"
      alt="Spotify"
    />

    <!-- Progress bar -->
    <div id="track">
      <div id="line"></div>
    </div>

    <!-- Header -->
    <div class="top-content">
      <i class="fa-solid fa-angle-left"></i>
      <div>
        <small>Step 2 of 3</small>
        <h3>Create a password</h3>
      </div>
    </div>

    <!-- FORM START -->
    <form method="post" class="container-count">
      {% csrf_token %}

      {% if error %}
      <div class="error-message" style="color: #ff3333; margin-bottom: 15px; font-size: 14px;">
        {{ error }}
      </div>
      {% endif %}

      <label class="label">Password</label>

      <div class="password-box">
        <input
          type="password"
          name="password"
          id="password"
          required
        />
        <i class="fa-solid fa-eye" id="eye"></i>
      </div>

      <p class="hint">Your password must contain at least</p>

      <div class="rules">
        <div>
          <input type="checkbox" disabled id="rule-letter" />
          <label>1 letter</label>
        </div>

        <div>
          <input type="checkbox" disabled id="rule-number" />
          <label>
            1 number or special character <br />(example: # ? ! &)
          </label>
        </div>

        <div>
          <input type="checkbox" disabled id="rule-length" />
          <label>10 characters</label>
        </div>
      </div>

      <!-- SUBMIT BUTTON -->
      <button type="submit" id="btm">Next</button>
    </form>
    <!-- FORM END -->

    <!-- Footer -->
    <div class="footer">
      <p>
        This site is protected by reCAPTCHA and the Google
        <a href="#">Privacy Policy</a> and
        <a href="#">Terms of Service</a> apply.
      </p>
    </div>

  </div>
</div>
</body>
</html>
